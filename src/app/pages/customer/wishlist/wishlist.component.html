<div class="page container wishlist-page fade-in">
  <div class="page-header">
    <h1>My Wishlist</h1>
    @if (wishlist.items().length) {
      <button type="button" class="btn btn--primary btn--sm" (click)="moveAllToCart()">Move all to cart</button>
    }
  </div>

  @if (wishlist.items().length === 0) {
    <app-empty-state
      icon="♡"
      title="Your wishlist is empty"
      message="Save items you love and shop them later."
      actionLabel="Explore Products"
    />
    <div class="empty-action"><a routerLink="/products" class="btn btn--primary">Browse Products</a></div>
  } @else {
    <div class="products-grid">
      @for (p of wishlist.items(); track p.id) {
        <div class="wishlist-item">
          <app-product-card [product]="p" />
          <button type="button" class="remove-btn" (click)="wishlist.remove(p.id)" aria-label="Remove">✕</button>
        </div>
      }
    </div>
  }
</div>
