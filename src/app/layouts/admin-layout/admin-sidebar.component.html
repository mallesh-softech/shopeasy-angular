<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      @if (!collapsed) {
        <div class="brand-text">
          <span class="brand-name">ShopEasy</span>
          <span class="brand-sub">Admin Console</span>
        </div>
      }
    </div>
    <button class="toggle-btn" (click)="toggleSidebar.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [title]="collapsed ? item.label : ''">
        <span class="nav-icon" [innerHTML]="item.icon"></span>
        @if (!collapsed) {
          <span class="nav-label">{{ item.label }}</span>
          @if (item.badge) { <span class="nav-badge">{{ item.badge }}</span> }
        }
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item logout-btn" (click)="logout()" [title]="collapsed ? 'Logout' : ''">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </span>
      @if (!collapsed) { <span class="nav-label">Logout</span> }
    </button>
  </div>
</aside>
