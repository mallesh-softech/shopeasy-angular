<header class="topbar">
  <div class="topbar-left">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search vendors, orders, customers..." />
    </div>
  </div>
  <div class="topbar-right">
    <!-- NOTIFICATIONS -->
    <div class="notif-menu">
      <button class="icon-btn" (click)="notifOpen.set(!notifOpen()); dropdownOpen.set(false)" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        @if (unreadCount() > 0) {
          <span class="badge">{{ unreadCount() }}</span>
        }
      </button>

      @if (notifOpen()) {
        <div class="notif-dropdown">
          <div class="notif-header">
            <strong>Notifications</strong>
            <button (click)="markAllRead()">Mark all read</button>
          </div>
          @for (n of notifications(); track n.id) {
            <div class="notif-item" [class.unread]="!n.read" (click)="n.read = true; updateUnread()">
              <span class="notif-icon">{{ n.icon }}</span>
              <div class="notif-body">
                <p class="notif-title">{{ n.title }}</p>
                <p class="notif-msg">{{ n.message }}</p>
                <span class="notif-time">{{ n.time }}</span>
              </div>
            </div>
          }
        </div>
      }
    </div>
    <div class="divider"></div>
    <div class="admin-profile" (click)="dropdownOpen.set(!dropdownOpen()); notifOpen.set(false)">
      <img [src]="admin()?.avatar" [alt]="admin()?.name" class="avatar" />
      <div class="admin-info">
        <span class="admin-name">{{ admin()?.name }}</span>
        <span class="admin-role">{{ admin()?.role }}</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      @if (dropdownOpen()) {
        <div class="dropdown">
          <a routerLink="/admin/profile" class="dropdown-item" (click)="dropdownOpen.set(false)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            My Profile
          </a>
          <a routerLink="/admin/settings" class="dropdown-item" (click)="dropdownOpen.set(false)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Settings
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" (click)="logout()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
